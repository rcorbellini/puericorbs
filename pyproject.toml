[project]
name = "puericorbs"
version = "0.1.0"
description = "O consultório pediátrico pequeno inteiro num lugar: agenda, cuidado da criança, dinheiro e família."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=11",
    "pillow-heif>=0.18",
    "segno>=1.6.6",
]

[project.scripts]
puericorbs = "puericorbs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["puericorbs"]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
